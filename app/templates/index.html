{% extends "base.html" %}

{% block content %}
<div class="gallery">
    {% for image in random_images %}
    <a href="{{ url_for(
        'main.image',
        folder=image['folder'],
        image=image['image']
    ) }}">
        <img
            src="{{ url_for(
                'main.image',
                folder=image['folder'],
                image=image['image']
            ) }}"
            alt="{{ image['image'] }}"
        >
    </a>
    {% endfor %}
</div>

{% endblock %}
