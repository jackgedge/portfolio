{% extends "base.html" %}

{% block content %}
<ul class="list">
    {% for folder in folders %}
    <li>
        <a
            class="hover-heading"
            href="{{ url_for('main.folder', folder=folder) }}"
        >
            <h2>{{ folder }}</h2>
        </a>
    </li>
    {% endfor %}
</ul>

{% endblock %}
