<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
</head>
<body>
    <h1>Portfolio</h1>

    <div class="folders">
        {% for folder in folders %}
            <a
                class="folder"
                href="{{ url_for('main.folder', folder=folder) }}"
            >
                📁 {{ folder }}
            </a>
        {% else %}
            <p>No portfolio folders found.</p>
        {% endfor %}
    </div>
</body>
</html>
