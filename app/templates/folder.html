{% extends "base.html" %}

{% block content %}
<div class="gallery">
    {% for image in images %}
        <a href="{{ url_for('main.image', folder=folder, image=image) }}">
            <img
                src="{{ url_for('main.image', folder=folder, image=image) }}"
                alt="{{ image }}"
                loading="lazy"
            >
        </a>
    {% endfor %}
</div>
{% endblock %}
