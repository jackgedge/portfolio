<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder|capitalize }}</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .gallery a {
            display: block;
        }
    </style>
</head>
<body>
    <h1>{{ folder|capitalize }}</h1>

    <div class="gallery">
        {% for image in images %}
            <figure>
                <a href="{{ url_for(
                    'main.image',
                    folder=folder,
                    image=image.name
                ) }}">
                    <img
                        src="{{ url_for(
                            'main.portfolio_image',
                            path=image.path
                        ) }}"
                        alt="{{ image.name }}"
                        loading="lazy"
                    >
                </a>
            </figure>
        {% else %}
            <p>No images found.</p>
        {% endfor %}
    </div>

    <a href="{{ url_for('main.portfolio') }}">
        Back to portfolios
    </a>
</body>
</html>
